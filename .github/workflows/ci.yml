name: CI (offline fixtures)
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify pinned official json-render Jev preview
        run: bun run verify:json-render
      - name: Type check
        run: bun run typecheck
      - name: Build with Bun
        run: bun run build
      - name: Unit and contract tests on Bun + bun:sqlite
        run: |
          mkdir -p reports
          set -o pipefail
          bun test tests/*.test.ts 2>&1 | tee reports/unit.tap
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser navigation tests
        run: bun run test:e2e
      # Runs after root-mode E2E: its production build uses a different BASE_PATH.
      - name: Static browser mode regressions (mocked OpenRouter, no secrets)
        run: bunx playwright test --config=playwright.pr1.config.ts
      - name: Upload reports and Bun reproducibility lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-${{ github.run_id }}
          path: |
            reports/
            test-results/
            bun.lock
            vendor/json-render-core-3ad38188.json
          retention-days: 14
      - name: Summary
        if: always()
        run: |
          echo '## Offline official-Jev + Bun validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bun 1.4.2 runtime/package manager/bundler, bun:sqlite, pinned source-built @json-render/core, official experimental composer + direct TypeSafe evaluator contract, TypeScript, contract tests and Chromium navigation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No external model calls.' >> "$GITHUB_STEP_SUMMARY"
