name: PR1 isolated repair workspace
on:
  push:
    branches: [codex/pr1-repair-validation]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3da3a979384a550f586fdd8abe887ef74a8451cd
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Export pinned public source and locked test dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr1-workspace"
          git bundle create "$RUNNER_TEMP/pr1-workspace/repository.bundle" HEAD
          tar -czf "$RUNNER_TEMP/pr1-workspace/node_modules.tar.gz" node_modules
          cp "$(command -v bun)" "$RUNNER_TEMP/pr1-workspace/bun"
          gzip "$RUNNER_TEMP/pr1-workspace/bun"
          git rev-parse HEAD > "$RUNNER_TEMP/pr1-workspace/HEAD.txt"
          bun --version > "$RUNNER_TEMP/pr1-workspace/BUN_VERSION.txt"
          cd "$RUNNER_TEMP/pr1-workspace"
          sha256sum repository.bundle node_modules.tar.gz bun.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pr1-pinned-workspace
          path: ${{ runner.temp }}/pr1-workspace/
          retention-days: 1
          if-no-files-found: error
