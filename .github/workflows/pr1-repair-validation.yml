name: PR1 repair validation
on:
  push:
    branches: [codex/pr1-repair-validation]
    paths: [.github/pr1-repair-manifest.json]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3da3a979384a550f586fdd8abe887ef74a8451cd
          path: work
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify and apply pinned repair payload
        working-directory: work
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3da3a979384a550f586fdd8abe887ef74a8451cd
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path('../transport/.github')
          manifest = json.loads((root / 'pr1-repair-manifest.json').read_text())
          payload = ''.join((root / name).read_text().strip() for name in manifest['parts'])
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == manifest['sha256'], 'Repair payload digest mismatch'
          pathlib.Path('../repair.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '../repair.patch'], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '../repair.patch'], check=True)
          if manifest.get('followup_patch'):
              pathlib.Path('../followup.patch').write_text(manifest['followup_patch'])
              subprocess.run(['git', 'apply', '--check', '../followup.patch'], check=True)
              subprocess.run(['git', 'apply', '../followup.patch'], check=True)
          css = pathlib.Path('ui/style.css')
          text = css.read_text()
          for old, new in manifest['css_replacements']:
              assert old in text, 'Stylesheet anchor changed'
              text = text.replace(old, new)
          css.write_text(text)
          PY
      - name: Install frozen dependencies and verify source
        working-directory: work
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          mkdir -p reports
          bun test tests/*.test.ts 2>&1 | tee reports/repair-unit.log
          bunx playwright install --with-deps chromium
      - name: Real server and forced-browser regressions
        working-directory: work
        run: bun run test:e2e
      - name: Static, framing and cross-tab browser regressions
        working-directory: work
        run: bun run test:static
      - name: Verify three cancellation regressions fail on the original head
        working-directory: work
        run: |
          set -euo pipefail
          git worktree add --detach ../baseline 3da3a979384a550f586fdd8abe887ef74a8451cd
          ln -s "$PWD/node_modules" ../baseline/node_modules
          cp tests/pr1-world-regressions.test.ts ../baseline/tests/
          cp ui/local-store.ts ../baseline/ui/
          set +e
          (cd ../baseline && NO_COLOR=1 bun test tests/pr1-world-regressions.test.ts --test-name-pattern 'World creator abort|late provider completion|cancellation during retry backoff') > reports/baseline-red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          text = Path('reports/baseline-red.log').read_text()
          for title in ['World creator abort does not fail a follower or duplicate generation', 'late provider completion after last waiter abort cannot cache', 'cancellation during retry backoff is prompt and never retries']:
              assert '(fail) PR1 integration: ' + title in text, title
          assert '3 fail' in text and '0 pass' in text, text
          print('Negative control: all three selected regressions fail on the old head, and pass on the patched source.')
          PY
      - name: Publish tested candidate only, never modify the PR branch
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          git add .env.example .github/workflows/ci.yml .github/workflows/live.yml README.md package.json playwright.config.ts playwright.static.config.ts tsconfig.json src ui tests scripts/test-static-server.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close PR #1 browser protocol, cancellation, storage and framing gaps' -m 'Separate native decisions from generator models; give shared flights per-waiter cancellation; serialize browser persistence with work-owned Web Locks; reject embedded startup before credentials are read; preserve native subpath links and forward complete live endpoint configuration. Add offline unit, integration and real Chromium regressions.'
          test "$(git rev-parse HEAD^)" = 3da3a979384a550f586fdd8abe887ef74a8451cd
          branch="codex/pr1-validated-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee reports/validated-head.txt
          printf 'Candidate branch: `%s`\nCandidate commit: `%s`\n' "$branch" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1-repair-validation-${{ github.run_id }}
          path: |
            work/reports/
            work/test-results/
          if-no-files-found: warn
          retention-days: 7
